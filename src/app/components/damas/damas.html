<h2 class="title-seccion-negro">Damas de Honor</h2>
<div class="damas-container">
    <div class="lista-damas">
        <div class="dama" *ngFor="let dama of damas">
            <img [src]="'http://localhost:3000/uploads/damas/' + dama.imagen_url" alt="dama.nombre">
            <p>{{ dama.nombre }}</p>
        </div>
    </div>
</div>
